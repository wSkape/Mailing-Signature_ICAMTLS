<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Émargement JPO</title>
<style>
  :root {
    --fond: #101418; --carte: #1b222a; --texte: #f2f5f7; --discret: #9aa7b2;
    --ok: #1e9e5a; --ko: #d64545; --attente: #b9820f; --info: #2f6fdd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 14px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 1.15rem; margin: 0 0 12px; }
  button, input { font: inherit; }
  button { border: 0; border-radius: 10px; padding: 12px 16px; background: var(--info); color: #fff; font-weight: 600; cursor: pointer; }
  button.secondaire { background: #2b3540; }
  button:disabled { opacity: .5; }
  input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #34404c; background: #0e1216; color: var(--texte); }
  #zone { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; margin-bottom: 10px; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #viseur { position: absolute; inset: 18% 18%; border: 3px solid rgba(255,255,255,.75); border-radius: 14px; pointer-events: none; }
  #pasdecamera { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--discret); text-align: center; padding: 16px; }
  #resultat { border-radius: 14px; padding: 16px; margin: 10px 0; min-height: 96px; background: var(--carte); }
  #resultat.ok { background: var(--ok); } #resultat.ko { background: var(--ko); }
  #resultat.attente { background: var(--attente); } #resultat.info { background: var(--info); }
  #resultat strong { display: block; font-size: 1.35rem; margin-bottom: 4px; }
  #resultat span { font-size: 1rem; word-break: break-word; }
  .ligne { display: flex; gap: 8px; margin: 10px 0; }
  details { background: var(--carte); border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
  summary { cursor: pointer; font-weight: 600; }
  details label { display: block; margin: 10px 0 4px; color: var(--discret); font-size: .9rem; }
  ol { padding-left: 20px; color: var(--discret); font-size: .92rem; }
  ol li.ok { color: #6fdc9b; } ol li.ko { color: #ff9a9a; }
  .note { color: var(--discret); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Émargement JPO</h1>

  <div id="zone">
    <video id="video" playsinline muted></video>
    <div id="viseur" hidden></div>
    <div id="pasdecamera">Appuyez sur « Démarrer la caméra » puis présentez le QR code.</div>
  </div>
  <div class="ligne">
    <button id="btnCamera" style="flex:1">Démarrer la caméra</button>
  </div>

  <div id="resultat" class="info"><strong>Prêt</strong><span>Aucun scan pour l'instant.</span></div>

  <div class="ligne">
    <input id="saisie" type="email" inputmode="email" autocomplete="off" placeholder="Saisie manuelle : prenom.nom@2030.icam.fr">
    <button id="btnSaisie" class="secondaire">Valider</button>
  </div>

  <details id="reglages">
    <summary>Réglages</summary>
    <label for="pin">Code d'équipe (mémorisé sur cet appareil)</label>
    <input id="pin" type="password" autocomplete="off" placeholder="Vide si aucun code n'est défini">
    <div class="ligne">
      <button id="btnPin" class="secondaire">Enregistrer</button>
      <button id="btnTest" class="secondaire">Tester la connexion</button>
      <button id="btnOublier" class="secondaire">Oublier</button>
    </div>
    <p class="note">Le test vérifie que la page peut joindre l'application Apps Script et lire sa réponse.</p>
  </details>

  <h2 style="font-size:1rem;margin:16px 0 4px">Derniers scans</h2>
  <ol id="histo"></ol>
</main>

<script src="config.js"></script>
<script src="jsQR.js"></script>
<script>
(function () {
  'use strict';

  var CFG = window.SCAN_CONFIG || {};
  var APP_URL = String(CFG.APP_URL || '').trim();
  var QR_EST_UNE_ADRESSE = CFG.QR_EST_UNE_ADRESSE !== false;
  var COOLDOWN_MS = 5000;   // le même QR est ignoré pendant 5 s (évite les envois en boucle si on le laisse devant la caméra)
  var DELAI_MAX_MS = 20000; // au-delà, on considère que le réseau ne répond pas

  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var flux = null, actif = false, envoiEnCours = false, verrouEcran = null;
  var dernier = { texte: '', t: 0 };
  var pin = '';

  /* ---------- Utilitaires ---------- */

  function lire(cle) { try { return window.localStorage.getItem(cle) || ''; } catch (e) { return ''; } }
  function ecrire(cle, val) { try { if (val) window.localStorage.setItem(cle, val); else window.localStorage.removeItem(cle); } catch (e) { /* stockage indisponible */ } }

  // Tout le texte venant du serveur est affiché avec textContent : jamais interprété comme du HTML.
  function afficher(type, titre, detail) {
    var bloc = $('resultat');
    bloc.className = type;
    bloc.innerHTML = '';
    var s1 = document.createElement('strong'); s1.textContent = titre;
    var s2 = document.createElement('span'); s2.textContent = detail || '';
    bloc.appendChild(s1); bloc.appendChild(s2);
  }

  function historique(type, texte) {
    var li = document.createElement('li');
    var h = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    li.className = type; li.textContent = h + ' – ' + texte;
    var liste = $('histo');
    liste.insertBefore(li, liste.firstChild);
    while (liste.children.length > 8) liste.removeChild(liste.lastChild);
  }

  function vibrer(ok) { try { if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 60, 120]); } catch (e) { /* non supporté */ } }

  /* ---------- Envoi à Apps Script ---------- */

  async function envoyer(texte) {
    if (envoiEnCours) return;
    if (!/^https:\/\/script\.google\.com\//.test(APP_URL)) {
      afficher('ko', 'Configuration manquante', "Renseignez l'adresse de l'application web dans config.js.");
      return;
    }
    envoiEnCours = true;
    afficher('attente', 'Envoi…', texte);

    // POST « simple » (corps de formulaire, aucun en-tête personnalisé) : pas de pré-requête CORS.
    var corps = new URLSearchParams();
    corps.set('email', texte);
    if (pin) corps.set('key', pin);

    var ctrl = new AbortController();
    var minuteur = setTimeout(function () { ctrl.abort(); }, DELAI_MAX_MS);
    try {
      var rep = await fetch(APP_URL, { method: 'POST', body: corps, signal: ctrl.signal });
      var rtxt = (await rep.text()).trim();
      if (/^success/i.test(rtxt)) {
        var detail = rtxt.replace(/^success\s*:?\s*/i, '');
        afficher('ok', 'Enregistré', detail);
        historique('ok', detail || texte);
        vibrer(true);
      } else {
        var msg = rtxt.replace(/^error\s*:?\s*/i, '').slice(0, 200);
        afficher('ko', 'Refusé', msg || 'Réponse inattendue');
        historique('ko', msg || 'réponse inattendue');
        if (/acc[eè]s refus/i.test(msg)) $('reglages').open = true;
        vibrer(false);
      }
    } catch (e) {
      // On ne renvoie JAMAIS automatiquement : le premier envoi a peut-être abouti. Vérifier dans l'onglet « Présences ».
      afficher('ko', 'Réponse non reçue',
        "Le scan a peut-être été enregistré. Vérifiez dans l'onglet « Présences » avant de rescanner. " +
        "Utilisez « Tester la connexion » dans les réglages.");
      historique('ko', 'réponse non reçue pour ' + texte);
      vibrer(false);
    } finally {
      clearTimeout(minuteur);
      dernier = { texte: texte, t: Date.now() };
      envoiEnCours = false;
    }
  }

  function traiterCode(brut) {
    var t = String(brut).trim();
    var maintenant = Date.now();
    if (t.toLowerCase() === dernier.texte.toLowerCase() && maintenant - dernier.t < COOLDOWN_MS) return;
    if (QR_EST_UNE_ADRESSE && t.indexOf('@') < 0) {
      dernier = { texte: t, t: maintenant };
      afficher('ko', 'QR non reconnu', "Ce QR code ne contient pas d'adresse mail.");
      vibrer(false);
      return;
    }
    envoyer(t);
  }

  /* ---------- Caméra ---------- */

  async function demarrerCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      afficher('ko', 'Caméra indisponible', "Ouvrez la page en HTTPS, dans Safari ou Chrome.");
      return;
    }
    try {
      flux = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
      });
    } catch (e) {
      afficher('ko', 'Accès à la caméra refusé', "Autorisez la caméra pour ce site dans les réglages du navigateur, puis réessayez.");
      return;
    }
    video.srcObject = flux;
    try { await video.play(); } catch (e) { /* lecture auto bloquée : la boucle attend les images */ }
    actif = true;
    $('pasdecamera').hidden = true; $('viseur').hidden = false;
    $('btnCamera').textContent = 'Arrêter la caméra';
    afficher('info', 'Caméra active', 'Présentez un QR code.');
    try { if (navigator.wakeLock) verrouEcran = await navigator.wakeLock.request('screen'); } catch (e) { /* facultatif */ }
    boucle();
  }

  function arreterCamera() {
    actif = false;
    if (flux) flux.getTracks().forEach(function (p) { p.stop(); });
    flux = null; video.srcObject = null;
    try { if (verrouEcran) verrouEcran.release(); } catch (e) { /* ignoré */ }
    $('pasdecamera').hidden = false; $('viseur').hidden = true;
    $('btnCamera').textContent = 'Démarrer la caméra';
  }

  function boucle() {
    if (!actif) return;
    if (!envoiEnCours && video.readyState >= 2 && video.videoWidth) {
      var echelle = Math.min(1, 640 / video.videoWidth); // on réduit l'image : lecture plus rapide
      canvas.width = Math.round(video.videoWidth * echelle);
      canvas.height = Math.round(video.videoHeight * echelle);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) traiterCode(code.data);
    }
    setTimeout(boucle, 120);
  }

  /* ---------- Réglages et boutons ---------- */

  async function testerConnexion() {
    afficher('attente', 'Test en cours…', '');
    try {
      var url = APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + 'ping=1';
      var rep = await fetch(url);
      var t = (await rep.text()).trim();
      afficher(/^ok/i.test(t) ? 'ok' : 'ko', /^ok/i.test(t) ? 'Connexion réussie' : 'Réponse inattendue', t.slice(0, 160));
    } catch (e) {
      afficher('ko', 'Connexion impossible',
        "Adresse incorrecte, déploiement non ouvert à « Tout le monde », ou réponse bloquée par le navigateur.");
    }
  }

  $('btnCamera').addEventListener('click', function () { if (actif) arreterCamera(); else demarrerCamera(); });
  $('btnSaisie').addEventListener('click', function () {
    var v = $('saisie').value.trim();
    if (v) { traiterCode(v); $('saisie').value = ''; }
  });
  $('saisie').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') $('btnSaisie').click(); });
  $('btnPin').addEventListener('click', function () {
    pin = $('pin').value.trim(); ecrire('jpo_pin', pin);
    afficher('info', 'Code enregistré', pin ? 'Mémorisé sur cet appareil.' : 'Aucun code (vide).');
  });
  $('btnOublier').addEventListener('click', function () { pin = ''; $('pin').value = ''; ecrire('jpo_pin', ''); afficher('info', 'Code oublié', ''); });
  $('btnTest').addEventListener('click', testerConnexion);
  document.addEventListener('visibilitychange', function () { if (document.hidden && actif) arreterCamera(); });

  pin = lire('jpo_pin'); $('pin').value = pin;
  if (!/^https:\/\/script\.google\.com\//.test(APP_URL)) {
    afficher('ko', 'Configuration manquante', "Renseignez l'adresse de l'application web dans config.js.");
  }

  // Exposé pour les tests automatiques (inoffensif en usage normal)
  window.__scan = { traiterCode: traiterCode, envoyer: envoyer };
})();
</script>
</body>
</html>
